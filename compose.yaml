# Local development services. Values come from .env (see .env.example).

# Fixed project name: by default Compose derives it from the folder name,
# so moving or renaming the folder would point it at a new, empty volume.
# Keep it as is, otherwise the existing data (volume personal-crm_pgdata) is not found.
name: personal-crm

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    ports:
      # Bind to localhost only, so the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Mail catcher: sign-in emails sent by the app land here instead of going out.
  # Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      # Bind to localhost only: 1025 receives mail (SMTP), 8025 is the web page and API
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
