# Every push to main: build the image, push it to GHCR tagged with the commit SHA,
# then deploy it to the test stand (staging): migrations -> new version -> smoke /health.
# Prod is not deployed here: only by hand, with the Deploy prod workflow, and only a
# SHA whose deploy to the test stand succeeded (deploy-prod.yml checks that history).
# The deploy logic lives in deploy/; this file only calls it.
name: Deploy staging

on:
  push:
    branches: [main]

# One run at a time, in the order of the pushes; a newer push waits for the running one.
# This is also why two deploys to the test stand never run at once (the server has a
# lock too). The group is set for the whole workflow only: a job with the same group
# would wait for its own workflow forever.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/artemjewpetya-lab/personal-crm

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The history of the test stand's deploys: GitHub -> Deployments -> staging.
    # Deploy prod reads it: only a SHA that succeeded here may go to prod.
    environment:
      name: staging
      url: https://test-app.personalcrm.site
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Run deploy/ci-deploy.sh staging
        run: bash deploy/ci-deploy.sh staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
