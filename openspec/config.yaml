schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Personal CRM - contacts of people the owner knows in person, not for sales.
  Product idea, main scenario, constraints and out-of-scope items: specs/01-продуктовая-идея.md
  How we work (stack, branches, data, deploy, secrets): CLAUDE.md
  The owner is not a developer: write in plain language and explain technical terms.
  Product decisions belong to the owner: anything not stated by the owner or in the specs goes to open questions, never invent it.
  Change names, capability names and everything in code are in English, kebab-case for changes and capabilities.

rules:
 specs:
   - Every scenario has its own test
 tasks:
   - Test before code - write the test, run it and see it fail, then write the code and see the test pass

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
